name: Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20"

      - name: Restore skills from lock
        run: >
          npx skills@1.9.0 experimental_install
          --frozen-lockfile --force -y
          -a cursor -a github-copilot -a codex -a gemini-cli -a claude-code

      - name: Working tree matches committed skills
        run: git diff --exit-code

      - name: Skills match skills-lock.json
        run: npx skills@1.9.0 check -y

      # skills-ref solo valida las skills propias: las de pstack traen
      # disable-model-invocation en el frontmatter upstream. La integridad de
      # las instaladas la garantizan skills-lock.json y los pasos anteriores.
      - name: Validate skill metadata (propias)
        run: |
          set -e
          for skill in .agents/skills/entorno-agentes .agents/skills/how .agents/skills/pr-lista .agents/skills/setup-proyecto .agents/skills/technical-writing; do
            npx skills-ref@0.1.5 validate "$skill"
          done